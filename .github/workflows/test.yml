name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # matches the Dockerfile base image
      - run: npm install --no-audit --no-fund
      - name: Syntax check
        run: for f in *.js; do node --check "$f"; done
      - run: npm test
